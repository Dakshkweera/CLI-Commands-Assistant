# pyproject.toml — tells Python how to install this project as a package.
# Once installed, `python -m nova` works from ANY folder (not just this one).
# This is like package.json's role in defining an installable Node package.

[project]
name = "nova"
version = "0.1.0"
description = "A self-correcting terminal command assistant"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "python-dotenv",
    "rich",
    "prompt_toolkit",
]

# The entry point: after `pip install`, this creates a real `nova` command that
# runs main(). (Like package.json's "bin" field in Node.)
[project.scripts]
nova = "nova.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Tell setuptools our code lives in the `nova` package (the nova/ folder).
[tool.setuptools]
packages = ["nova"]
